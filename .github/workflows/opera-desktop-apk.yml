name: Build Opera Desktop Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - opera-desktop-apk
    paths:
      - 'opera-desktop-builder/**'
      - '.github/workflows/opera-desktop-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout wrapper project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build components
        run: |
          SDKMANAGER=/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;24.0.8215888" \
            "cmake;3.22.1"

      - name: Fetch Winlator 11.2 source
        run: |
          git clone https://github.com/brunodev85/winlator-app.git winlator-src
          cd winlator-src
          git checkout a030f552f452158a2db64fdb32b490fa19c0b48d
          chmod +x gradlew

      - name: Download exact Opera One x64 installer
        run: |
          mkdir -p winlator-src/app/src/main/assets/opera
          curl --fail --location --retry 4 --retry-delay 3 \
            'https://get.geo.opera.com/pub/opera/desktop/136.0.6008.80/win/Opera_136.0.6008.80_Setup_x64.exe' \
            -o winlator-src/app/src/main/assets/opera/OperaSetup.exe
          echo '4f4593749f89c075f05a3d6102a970e866eb7df2c964e34465f8939299ef24dd  winlator-src/app/src/main/assets/opera/OperaSetup.exe' | sha256sum -c -

      - name: Patch Winlator into one-tap Opera Desktop app
        run: python3 opera-desktop-builder/patch_winlator.py

      - name: Build installable APK
        working-directory: winlator-src
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: |
          mkdir -p output
          cp winlator-src/app/build/outputs/apk/debug/app-debug.apk output/Opera-Desktop-Android.apk
          sha256sum output/Opera-Desktop-Android.apk > output/SHA256.txt
          ls -lh output/Opera-Desktop-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Opera-Desktop-Android
          path: |
            output/Opera-Desktop-Android.apk
            output/SHA256.txt
          if-no-files-found: error
          retention-days: 14
