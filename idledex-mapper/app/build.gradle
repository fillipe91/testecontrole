plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fillipe.webmapper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fillipe.idledexcompanion'
        minSdk 24
        targetSdk 35
        versionCode 21
        versionName '2.0.1'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
