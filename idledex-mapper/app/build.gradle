plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fillipe.webmapper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.fillipe.webmapper'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
